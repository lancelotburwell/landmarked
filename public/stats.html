<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Landmarked stats</title>
<style>body { background: #0e1012; color: #ece6da; font: 14px ui-monospace, monospace; }</style>
<script>
  // The statistics now live in the admin page (planner.html#stats). Old links
  // (stats.html#KEY) still work: the key is saved for that page, then we move on.
  const k = decodeURIComponent(location.hash.slice(1)).trim();
  if (k) try { localStorage.setItem('planner:key', k); } catch {}
  location.replace('planner.html#stats');
</script>
</head>
<body><p><a href="planner.html#stats" style="color:#e3b261">Statistics moved to the admin page.</a></p></body>
</html>
