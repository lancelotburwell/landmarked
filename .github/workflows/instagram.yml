# Posts the approved Instagram posts at their time. Every 15 minutes it asks
# landmarked.land/api/instagram to publish whatever is approved and due (Zurich
# time) and not posted yet; the function does the work and keeps the state in
# Upstash. A failed post makes this run fail, so GitHub emails the owner (at most
# three tries per post). Approve posts in the planner: /planner.html#instagram.
# Needs the repo secret CRON_SECRET, the same value as in Vercel.
name: Publish Instagram posts

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish due posts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set: nothing to do."; exit 0; fi
          curl -sS --fail-with-body --max-time 120 -X POST https://landmarked.land/api/instagram \
            -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' \
            -d '{"action":"run"}'
